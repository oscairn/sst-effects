# Oscairn plugin release configuration.
#
# The ONE place holding this repo's release facts. When copying this release setup to
# another Oscairn plugin fork, edit only this file; build.sh, check_deps.py,
# licenses.sh, manifest.py and selfcheck.py stay generic.
#
# KEY=VALUE, one per line, comments on their own line: sourced by POSIX sh and
# parsed by the Python scripts the same way.

NAME=oscairn-effects
# File stem of each release asset: <NAME>-<platform>.clap

PACKAGE_ID=org.oscairn.effects
PACKAGE_NAME="Oscairn Effects"
PACKAGE_SUMMARY="Oscairn's effects (Reverb with Hall A, EQ, Delay, Dynamics, Tremolo & Rotary) built on sst-effects."
# SPDX expression, as published in the packages repo (quoted: sourced by sh, and it has spaces):
LICENSE="GPL-3.0-or-later AND MIT"
# Every plugin in the bundle as "descriptor-file@plugin-id=kind" pairs (kind: synth |
# effect | note-effect); this repo's five plugins share one descriptor file, so each pair
# names its id; each plugin's own version is read from its clap_plugin_descriptor_t:
PLUGINS="src/oscairn-clap/OscairnEffects.cpp@org.oscairn.effects.reverb=effect src/oscairn-clap/OscairnEffects.cpp@org.oscairn.effects.eq=effect src/oscairn-clap/OscairnEffects.cpp@org.oscairn.effects.delay=effect src/oscairn-clap/OscairnEffects.cpp@org.oscairn.effects.dynamics=effect src/oscairn-clap/OscairnEffects.cpp@org.oscairn.effects.tremolo-rotary=effect"
# The package version: defined here for the first time as the CMake version of the
# Oscairn project (upstream's sst-effects version belongs to upstream):
PROJECT_VERSION_FILE=src/oscairn-clap/CMakeLists.txt
SOURCE_URL=https://github.com/oscairn/sst-effects
# Releases are tagged oscairn-vX.Y.Z (upstream v* tags exist in forks):
TAG_PREFIX=oscairn-
# CMake tree to configure (the whole repo: sst-effects is header-only and the Oscairn
# plugins are a subdirectory), its CMake flags, and the .clap it produces in the build dir:
CMAKE_SOURCE_DIR=.
CMAKE_EXTRA_FLAGS="-DSST_EFFECTS_BUILD_OSCAIRN=ON -DSST_EFFECTS_BUILD_TESTS=ON"
CLAP_FILE=src/oscairn-clap/oscairn-effects.clap
# The CLAP headers come from the CPM pin in cmake/oscairn-deps.cmake (CLAP_VERSION is
# read from its GIT_TAG), and the vendored SDK headers' commit from its upstream.json:
CLAP_VERSION_FILE=cmake/oscairn-deps.cmake
OSCAIRN_CLAP_UPSTREAM=libs/oscairn-clap/upstream.json
# The tests the release workflow runs, one shell command line with BUILD_DIR pointing at
# the release build (upstream's tests, ours, and the privacy check per plugin id, listed
# from the plugin's own factory so a new plugin needs no edit here; the stock-vs-fork gate
# is oscairn.yml's, not repeated here):
TESTS='"$BUILD_DIR/sst-effects-test" && "$BUILD_DIR/src/oscairn-clap/oscairn-effects-tests" && ids=$("$BUILD_DIR/src/oscairn-clap/oscairn-effects-privacy-host" --list "$BUILD_DIR/src/oscairn-clap/oscairn-effects.clap") && [ -n "$ids" ] && for id in $ids; do src/oscairn-clap/tests/privacy-check.sh "$BUILD_DIR/src/oscairn-clap/oscairn-effects-privacy-host" "$BUILD_DIR/src/oscairn-clap/oscairn-effects.clap" "$id"; done'
# Asset dependencies as "id@version" pairs (from the published record; none so far):
ASSET_DEPS=
# Licence/notice files the binary needs, as "path=licenses-name" pairs -> licenses/<name>:
# the seven of the published 0.1.1 record, plus the sst-waveshapers notice (its headers
# are compiled in too; the 0.1.1 record missed it).
LICENSE_FILES="LICENSE.md=sst-effects-LICENSE.md libs/oscairn-clap/LICENSE=oscairn-clap-LICENSE src/oscairn-clap/release/licences/clap-LICENSE=clap-LICENSE src/oscairn-clap/release/licences/fmt-LICENSE=fmt-LICENSE src/oscairn-clap/release/licences/simde-COPYING=simde-COPYING src/oscairn-clap/release/licences/sst-basic-blocks-LICENSE.md=sst-basic-blocks-LICENSE.md src/oscairn-clap/release/licences/sst-filters-LICENSE.md=sst-filters-LICENSE.md src/oscairn-clap/release/licences/sst-waveshapers-LICENSE.md=sst-waveshapers-LICENSE.md"
