# Oscairn effects (src/oscairn-clap, doc/oscairn-plan.md): build the plugins, run upstream's
# tests and ours, and the stock-vs-fork gate, on Linux x86_64, Linux ARM64 and macOS, and the
# tests under ASan/UBSan and TSan.
name: Oscairn
on:
  push:
    branches:
      - oscairn
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plugin:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            compiler: gcc
            sanitizer: none
            flags: ""
            gate: true
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            compiler: gcc
            sanitizer: none
            flags: ""
            gate: true
          - name: macOS arm64
            os: macos-15
            compiler: appleclang
            sanitizer: none
            flags: ""
            gate: true
          - name: Linux ARM64 ASan UBSan
            os: ubuntu-24.04-arm
            compiler: gcc
            sanitizer: asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
            gate: false
          - name: Linux ARM64 TSan
            os: ubuntu-24.04-arm
            compiler: gcc
            sanitizer: tsan
            flags: "-fsanitize=thread"
            gate: false
    env:
      # the CPM packages, downloaded once and kept in the cache below; and ccache for every
      # cmake build in the job, the stock gate's included
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the stock gate needs the upstream history (merge-base with origin/main)
      - name: Install Ninja
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then sudo apt-get update && sudo apt-get install -y ninja-build; else brew install ninja; fi
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
      - name: CPU fingerprint
        id: cpu
        run: |
          # sst-effects-test and the stock renderers build with -march=native on Linux, so a cached
          # object only runs on a CPU with the same instructions: share ccache only between
          # runners that support the same set (its own hash holds no CPU information).
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cpu=$( { uname -m; sed -nE 's/^(model name|Model name|flags|Features)[[:space:]]*:[[:space:]]*(.*)/\2/p' /proc/cpuinfo | sort -u; } | sha256sum | cut -c1-16 )
          else
            cpu=$(uname -m) # no -march=native target builds on macOS
          fi
          echo "cpu=$cpu" >> "$GITHUB_OUTPUT"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: oscairn-effects-${{ matrix.os }}-${{ matrix.compiler }}-RelWithDebInfo-${{ matrix.sanitizer }}-${{ steps.cpu.outputs.cpu }}
          max-size: 1000M
          evict-old-files: job
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSST_EFFECTS_BUILD_OSCAIRN=ON \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}" -DCMAKE_MODULE_LINKER_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build --target oscairn-effects oscairn-effects-tests sst-effects-test oscairn-effects-privacy-host
      - name: Upstream tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ./build/sst-effects-test
      - name: Oscairn tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ./build/src/oscairn-clap/oscairn-effects-tests
      - name: Privacy
        run: |
          for id in reverb eq delay dynamics; do
            src/oscairn-clap/tests/privacy-check.sh build/src/oscairn-clap/oscairn-effects-privacy-host \
              build/src/oscairn-clap/oscairn-effects.clap org.oscairn.effects.$id
          done
      - name: Stock-vs-fork gate
        if: matrix.gate
        run: ./src/oscairn-clap/scripts/stock-gate.sh build-stock-gate
